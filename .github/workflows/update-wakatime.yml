name: Update wakatime.svg

on:
  schedule:
    - cron: "0 * * * *"    # раз в час
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "assets/wakatime.template.svg"
      - "scripts/generate_wakatime.py"

permissions:
  contents: write

jobs:
  update-wakatime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate wakatime.svg
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/generate_wakatime.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- wakatime.svg; then
            echo "No changes, skipping commit."
          else
            git add wakatime.svg
            git commit -m "chore: auto-update wakatime.svg [skip ci]"
            git push
          fi
