name: Update discord.svg

on:
  schedule:
    - cron: "*/10 * * * *"   # раз в 10 минут
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "assets/discord.template.svg"
      - "scripts/generate_discord.py"

permissions:
  contents: write

jobs:
  update-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate discord.svg
        env:
          DISCORD_USER_ID: "ВПИШИ_СВОЙ_DISCORD_ID"
        run: python3 scripts/generate_discord.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- discord.svg; then
            echo "No changes, skipping commit."
          else
            git add discord.svg
            git commit -m "chore: auto-update discord.svg [skip ci]"
            git push
          fi
